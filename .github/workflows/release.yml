name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build release artifacts
    if: github.repository == 'alitycs/alitycs-sdk-go'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag_commit: ${{ steps.verify_tag.outputs.tag_commit }}
      tag_object: ${{ steps.verify_tag.outputs.tag_object }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag targets reviewed main history
        id: verify_tag
        shell: bash
        run: |
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "error: releases require an annotated tag" >&2
            exit 1
          fi
          tag_object="$(git rev-parse "${GITHUB_REF}^{tag}")"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ && "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          main_commit="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          git merge-base --is-ancestor "$tag_commit" "$main_commit"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sdk_version="$(awk -F'"' '/Version = / { print $2; exit }' doc.go)"
          [[ "$GITHUB_REF_NAME" == "v${sdk_version}" ]]
          printf 'tag_commit=%s\ntag_object=%s\n' "$tag_commit" "$tag_object" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify release
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          ./scripts/check-coverage.sh
      - name: Prepare source artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          git archive --format=tar.gz --prefix="alitycs-sdk-go-${version}/" \
            --output="release/alitycs-sdk-go-${version}.tar.gz" "$GITHUB_SHA"
          (cd release && sha256sum -- ./*.tar.gz > SHA256SUMS)
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release/
      - name: Verify artifact checksums
        run: (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{tag}")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" == "$EXPECTED_TAG_COMMIT" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_TAG_COMMIT" ]]
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
